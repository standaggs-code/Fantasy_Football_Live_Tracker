<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleeper League Dashboard</title>

    <!-- ======================================================= -->
    <!--  USER CONFIGURATION: EDIT YOUR USERNAME                 -->
    <!-- ======================================================= -->
    <script>
        const SLEEPER_USERNAME = "standaggs";
    </script>
    <!-- ======================================================= -->

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0; background: #030712; z-index: 60; 
            transition: opacity 0.3s ease-in-out;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans h-screen overflow-hidden flex flex-col relative">

    <!-- Loading Screen -->
    <div id="loading-screen" class="flex flex-col items-center justify-center" style="display: flex; opacity: 1;">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-bold text-white mb-2" id="loading-title">Connecting to Sleeper API</h2>
        <p class="text-gray-400 text-sm" id="loading-text">Fetching league matchups...</p>
    </div>

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 shrink-0 flex flex-col md:flex-row justify-between items-center gap-4 z-10 shadow-md">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">League Dashboard</h1>
                <p class="text-xs text-blue-400 font-medium" id="week-indicator">Week --</p>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
            <input type="text" id="username-input" class="bg-gray-950 text-sm text-white px-3 py-2 rounded-md border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors w-full md:w-40" placeholder="Sleeper Username">
            <button id="load-user-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors shadow-sm">Load</button>
            <select id="league-selector" class="bg-gray-950 text-sm text-white px-3 py-2 rounded-md border border-gray-700 hidden focus:outline-none focus:border-blue-500 cursor-pointer max-w-[200px] truncate">
                <!-- Populated dynamically -->
            </select>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0 bg-[#0a0f1c]">
        
        <!-- Left Column: My Matchup Deep Dive -->
        <section class="flex-1 flex flex-col border-b lg:border-b-0 lg:border-r border-gray-800 relative min-h-0">
            <div class="p-4 border-b border-gray-800 bg-gray-900/40 shrink-0 flex justify-between items-center backdrop-blur-sm">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span> My Matchup
                </h2>
                <div id="matchup-margin" class="px-3 py-1 bg-gray-950 rounded-full text-xs font-bold border border-gray-800 text-gray-400">
                    Vs
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-6" id="my-matchup-container">
                <div class="flex h-full items-center justify-center text-gray-500 italic text-sm">
                    Select a league to view your matchup.
                </div>
            </div>
        </section>

        <!-- Right Column: League Scoreboard -->
        <section class="flex-1 flex flex-col relative min-h-0 lg:max-w-xl xl:max-w-2xl bg-gray-950">
            <div class="p-4 border-b border-gray-800 bg-gray-900/40 shrink-0 flex justify-between items-center backdrop-blur-sm">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> League Scoreboard
                </h2>
                <span class="text-xs text-gray-500 bg-gray-800 px-2 py-1 rounded-md" id="league-update-time">Updates every 30s</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-6" id="league-scoreboard-container">
                <div class="grid grid-cols-1 gap-4" id="league-matchups-grid">
                    <!-- Scoreboard Cards Injected Here -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // Initialize username from config
        document.getElementById('username-input').value = typeof SLEEPER_USERNAME !== 'undefined' ? SLEEPER_USERNAME : "";

        // --- STATE VARIABLES ---
        let SLEEPER_USER_ID = null;
        let CURRENT_NFL_WEEK = null;
        let CURRENT_NFL_SEASON = null;
        let CURRENT_LEAGUE_ID = null;
        let WEEKLY_PROJECTIONS = {};
        let SLEEPER_PLAYERS_DB = null;
        
        // Polling interval
        let matchupInterval = null;

        // --- UI UTILITIES ---
        function showLoading(msg) {
            const screen = document.getElementById('loading-screen');
            document.getElementById('loading-text').innerText = msg;
            screen.style.display = 'flex';
            setTimeout(() => screen.style.opacity = '1', 10);
        }

        function hideLoading() {
            const screen = document.getElementById('loading-screen');
            screen.style.opacity = '0';
            setTimeout(() => screen.style.display = 'none', 300);
        }

        // --- CORE LOGIC ---
        async function loadUserLeagues() {
            const usernameInput = document.getElementById('username-input').value.trim();
            if (!usernameInput) return;

            showLoading(`Looking up user: ${usernameInput}...`);
            const selector = document.getElementById('league-selector');
            selector.classList.add('hidden');
            
            try {
                if (!CURRENT_NFL_WEEK || !CURRENT_NFL_SEASON) {
                    const stateRes = await fetch("https://api.sleeper.app/v1/state/nfl");
                    const state = await stateRes.json();
                    CURRENT_NFL_WEEK = state.leg || state.week;
                    CURRENT_NFL_SEASON = state.season;
                    document.getElementById('week-indicator').innerText = `NFL Week ${CURRENT_NFL_WEEK}`;
                }

                const userRes = await fetch(`https://api.sleeper.app/v1/user/${usernameInput}`);
                const user = await userRes.json();
                if (!user || !user.user_id) throw new Error("User not found.");
                SLEEPER_USER_ID = user.user_id;

                showLoading("Finding your active leagues...");
                const leaguesRes = await fetch(`https://api.sleeper.app/v1/user/${SLEEPER_USER_ID}/leagues/nfl/${CURRENT_NFL_SEASON}`);
                const leagues = await leaguesRes.json();

                if (!leagues || leagues.length === 0) {
                    throw new Error("No active leagues found for this season.");
                }

                selector.innerHTML = leagues.map(l => `<option value="${l.league_id}">${l.name}</option>`).join('');
                selector.classList.remove('hidden');

                await switchLeague(leagues[0].league_id);

            } catch(e) {
                console.error(e);
                document.getElementById('loading-text').innerHTML = `<span class="text-red-400">${e.message || "Error loading user data."}</span>`;
                setTimeout(hideLoading, 3000);
            }
        }

        async function switchLeague(leagueId) {
            showLoading("Extracting league data...");
            CURRENT_LEAGUE_ID = leagueId;
            
            if (matchupInterval) {
                clearInterval(matchupInterval);
            }

            try {
                // Fetch projections if needed
                if (!WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]) {
                    showLoading("Fetching weekly scoring projections...");
                    const projRes = await fetch(`https://api.sleeper.app/v1/projections/nfl/regular/${CURRENT_NFL_SEASON}/${CURRENT_NFL_WEEK}`);
                    WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK] = await projRes.json();
                }

                // Fetch player DB if needed
                if (!SLEEPER_PLAYERS_DB) {
                    showLoading("Downloading NFL Player Database... (One time only)");
                    const playersRes = await fetch("https://api.sleeper.app/v1/players/nfl");
                    SLEEPER_PLAYERS_DB = await playersRes.json();
                }

                await fetchAndRenderDashboard();
                
                // Poll Sleeper every 30 seconds for live score updates
                matchupInterval = setInterval(fetchAndRenderDashboard, 30000);

                hideLoading();
            } catch(e) {
                console.error("League Load Error:", e);
                document.getElementById('loading-text').innerHTML = `<span class="text-red-400">Error: Could not load league.</span>`;
                setTimeout(hideLoading, 3000);
            }
        }

        async function fetchAndRenderDashboard() {
            if (!CURRENT_LEAGUE_ID) return;

            try {
                // 1. Fetch League Data (for roster positions)
                const leagueRes = await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}`);
                const leagueData = await leagueRes.json();
                const rosterPositions = leagueData.roster_positions || [];

                // 2. Fetch Rosters (to map roster_id to owner_id)
                const rostersRes = await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}/rosters`);
                const rosters = await rostersRes.json();

                // 3. Fetch Users (to map owner_id to team name/avatar)
                const usersRes = await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}/users`);
                const usersData = await usersRes.json();

                // Build a quick lookup dictionary for team info
                const teamInfo = {};
                rosters.forEach(r => {
                    const user = usersData.find(u => u.user_id === r.owner_id);
                    let name = "Empty Roster";
                    let avatar = "https://sleepercdn.com/images/v2/icons/player_default.webp";
                    if (user) {
                        name = user.metadata?.team_name || user.display_name;
                        if (user.avatar) {
                            avatar = `https://sleepercdn.com/avatars/thumbs/${user.avatar}`;
                        }
                    }
                    teamInfo[r.roster_id] = { name, avatar, owner_id: r.owner_id, roster: r };
                });

                // 4. Fetch Matchups (Live Scores & Lineups)
                const matchupsRes = await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}/matchups/${CURRENT_NFL_WEEK}`);
                const matchups = await matchupsRes.json();

                // Group Matchups by matchup_id
                const groupedMatchups = {};
                let myMatchupId = null;

                matchups.forEach(m => {
                    if (!groupedMatchups[m.matchup_id]) {
                        groupedMatchups[m.matchup_id] = [];
                    }
                    groupedMatchups[m.matchup_id].push(m);

                    const tInfo = teamInfo[m.roster_id];
                    if (tInfo && tInfo.owner_id === SLEEPER_USER_ID) {
                        myMatchupId = m.matchup_id;
                    }
                });

                // Helper: Calculate active points
                const calculatePoints = (matchup) => {
                    let actual = 0;
                    let proj = 0;
                    
                    if (!matchup || !matchup.starters) return { actual: 0, proj: 0 };
                    
                    matchup.starters.forEach(playerId => {
                        if (playerId === "0") return; // Empty slot
                        
                        // Actual
                        if (matchup.players_points && matchup.players_points[playerId]) {
                            actual += matchup.players_points[playerId];
                        }
                        
                        // Projected
                        const pObj = WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]?.[playerId];
                        if (pObj) {
                            proj += pObj.pts_ppr ?? pObj.pts_half_ppr ?? pObj.pts_std ?? 
                                    pObj.stats?.pts_ppr ?? pObj.stats?.pts_half_ppr ?? pObj.stats?.pts_std ?? 0;
                        }
                    });
                    
                    return { actual, proj };
                };

                // === RENDER LEAGUE SCOREBOARD ===
                const scoreboardGrid = document.getElementById('league-matchups-grid');
                let scoreboardHTML = '';

                Object.keys(groupedMatchups).forEach(mId => {
                    const teams = groupedMatchups[mId];
                    if (teams.length !== 2) return; // Ignore incomplete matchups or bye weeks for now

                    const team1 = teams[0];
                    const team2 = teams[1];
                    
                    const info1 = teamInfo[team1.roster_id];
                    const info2 = teamInfo[team2.roster_id];
                    
                    const pts1 = calculatePoints(team1);
                    const pts2 = calculatePoints(team2);
                    
                    const isMyMatchup = (mId == myMatchupId);
                    const borderClass = isMyMatchup ? 'border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'border-gray-800 hover:border-gray-700';
                    const bgClass = isMyMatchup ? 'bg-gray-900/80' : 'bg-gray-900/50';

                    scoreboardHTML += `
                        <div class="rounded-xl border ${borderClass} ${bgClass} p-4 flex flex-col gap-3 transition-colors">
                            ${isMyMatchup ? '<div class="text-[10px] uppercase font-bold tracking-widest text-blue-400 mb-1">Your Matchup</div>' : ''}
                            
                            <!-- Team 1 -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <img src="${info1.avatar}" class="w-8 h-8 rounded-full bg-gray-800 shrink-0 border border-gray-700 object-cover" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                    <span class="font-semibold text-gray-200 truncate ${pts1.actual > pts2.actual ? 'text-white' : ''}">${info1.name}</span>
                                </div>
                                <div class="text-right shrink-0 ml-4">
                                    <div class="text-lg font-bold font-mono ${pts1.actual > pts2.actual ? 'text-white' : 'text-gray-400'}">${pts1.actual.toFixed(2)}</div>
                                    <div class="text-[10px] text-gray-500 font-mono">Proj: ${pts1.proj.toFixed(2)}</div>
                                </div>
                            </div>
                            
                            <div class="w-full h-px bg-gray-800/60 my-1"></div>
                            
                            <!-- Team 2 -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <img src="${info2.avatar}" class="w-8 h-8 rounded-full bg-gray-800 shrink-0 border border-gray-700 object-cover" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                    <span class="font-semibold text-gray-200 truncate ${pts2.actual > pts1.actual ? 'text-white' : ''}">${info2.name}</span>
                                </div>
                                <div class="text-right shrink-0 ml-4">
                                    <div class="text-lg font-bold font-mono ${pts2.actual > pts1.actual ? 'text-white' : 'text-gray-400'}">${pts2.actual.toFixed(2)}</div>
                                    <div class="text-[10px] text-gray-500 font-mono">Proj: ${pts2.proj.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                scoreboardGrid.innerHTML = scoreboardHTML;

                // === RENDER MY MATCHUP DEEP DIVE ===
                const myMatchupContainer = document.getElementById('my-matchup-container');
                const marginEl = document.getElementById('matchup-margin');
                
                if (myMatchupId && groupedMatchups[myMatchupId].length === 2) {
                    const mTeams = groupedMatchups[myMatchupId];
                    let myM = mTeams.find(m => teamInfo[m.roster_id].owner_id === SLEEPER_USER_ID);
                    let oppM = mTeams.find(m => teamInfo[m.roster_id].owner_id !== SLEEPER_USER_ID);
                    
                    if(!myM) myM = mTeams[0]; // fallback
                    if(!oppM) oppM = mTeams[1];
                    
                    const myInfo = teamInfo[myM.roster_id];
                    const oppInfo = teamInfo[oppM.roster_id];
                    const myPts = calculatePoints(myM);
                    const oppPts = calculatePoints(oppM);
                    
                    // Update Margin
                    const diff = myPts.actual - oppPts.actual;
                    if (myPts.actual === 0 && oppPts.actual === 0) {
                        marginEl.innerHTML = `Tied`;
                    } else if (diff > 0) {
                        marginEl.innerHTML = `<span class="text-green-400">Winning by ${diff.toFixed(2)}</span>`;
                    } else if (diff < 0) {
                        marginEl.innerHTML = `<span class="text-red-400">Losing by ${Math.abs(diff).toFixed(2)}</span>`;
                    } else {
                        marginEl.innerHTML = `<span class="text-gray-400">Tied</span>`;
                    }

                    // Build Player Roster HTML
                    const renderPlayerLineup = (matchup, info, isMe) => {
                        const activePos = rosterPositions.filter(p => p !== 'BN');
                        
                        let html = `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-lg mb-6">
                                <!-- Header -->
                                <div class="p-4 border-b border-gray-800 flex items-center justify-between ${isMe ? 'bg-blue-900/20' : 'bg-red-900/10'}">
                                    <div class="flex items-center gap-3 overflow-hidden">
                                        <img src="${info.avatar}" class="w-10 h-10 rounded-full border border-gray-700 object-cover shrink-0" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                        <div class="truncate">
                                            <h3 class="font-bold text-white text-base truncate">${info.name}</h3>
                                            <p class="text-xs ${isMe ? 'text-blue-400' : 'text-red-400'} uppercase tracking-wide font-semibold">${isMe ? 'My Team' : 'Opponent'}</p>
                                        </div>
                                    </div>
                                    <div class="text-right shrink-0 pl-3">
                                        <div class="text-2xl font-bold font-mono text-white leading-none mb-1">${calculatePoints(matchup).actual.toFixed(2)}</div>
                                        <div class="text-xs text-gray-400 font-mono tracking-tighter">Proj: ${calculatePoints(matchup).proj.toFixed(2)}</div>
                                    </div>
                                </div>
                                <!-- Starters -->
                                <div class="p-3 flex flex-col gap-1.5">
                        `;
                        
                        // Render Starters
                        matchup.starters.forEach((playerId, idx) => {
                            const pos = activePos[idx] || 'FLEX';
                            
                            if (playerId === "0") {
                                html += `
                                    <div class="flex items-center gap-3 p-2 rounded bg-gray-950/50 border border-gray-800/50">
                                        <div class="text-[10px] font-bold text-gray-600 w-10 shrink-0 text-right pr-2 border-r border-gray-800">${pos}</div>
                                        <div class="text-sm text-gray-600 italic">Empty Slot</div>
                                    </div>
                                `;
                                return;
                            }
                            
                            const pData = SLEEPER_PLAYERS_DB[playerId];
                            let pName = playerId;
                            let pPos = pos;
                            let pTeam = "";
                            let pImg = `https://sleepercdn.com/content/nfl/players/thumb/${playerId}.jpg`;
                            
                            if (playerId.length <= 4 && isNaN(parseInt(playerId))) {
                                // Defense
                                pName = `${playerId} Defense`;
                                pTeam = playerId;
                                pImg = `https://sleepercdn.com/images/team_logos/nfl/${playerId.toLowerCase()}.png`;
                            } else if (pData) {
                                pName = `${pData.first_name} ${pData.last_name}`;
                                pTeam = pData.team || "FA";
                            }
                            
                            const actualPts = matchup.players_points ? (matchup.players_points[playerId] || 0) : 0;
                            
                            let projPts = 0;
                            const projObj = WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]?.[playerId];
                            if (projObj) {
                                projPts = projObj.pts_ppr ?? projObj.pts_half_ppr ?? projObj.pts_std ?? 
                                          projObj.stats?.pts_ppr ?? projObj.stats?.pts_half_ppr ?? projObj.stats?.pts_std ?? 0;
                            }
                            
                            html += `
                                <div class="flex items-center gap-2 md:gap-3 p-2 rounded bg-gray-800/40 border border-gray-700/50 hover:bg-gray-800/70 transition-colors">
                                    <div class="text-[10px] font-bold ${isMe ? 'text-blue-400/80' : 'text-gray-500'} w-8 md:w-10 shrink-0 text-right pr-2 border-r border-gray-700/50">${pos}</div>
                                    <div class="w-8 h-8 md:w-10 md:h-10 shrink-0 bg-gray-900 rounded-full border border-gray-700 overflow-hidden flex items-center justify-center">
                                        <img src="${pImg}" class="w-full h-full object-cover" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="font-semibold text-gray-200 text-sm truncate">${pName}</div>
                                        <div class="text-[10px] text-gray-500 tracking-wider">${pTeam}</div>
                                    </div>
                                    <div class="text-right shrink-0">
                                        <div class="text-sm md:text-base font-bold font-mono text-white">${actualPts.toFixed(2)}</div>
                                        <div class="text-[9px] md:text-[10px] text-gray-500 font-mono tracking-tighter">Proj ${projPts.toFixed(2)}</div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        html += `</div></div>`;
                        return html;
                    };

                    myMatchupContainer.innerHTML = renderPlayerLineup(myM, myInfo, true) + renderPlayerLineup(oppM, oppInfo, false);

                } else {
                    myMatchupContainer.innerHTML = `<div class="flex h-full items-center justify-center text-gray-500 italic">Could not load matchup details.</div>`;
                }

                document.getElementById('league-update-time').innerText = `Updated: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.warn("Dashboard fetch warning:", error);
            }
        }

        // Event Listeners
        document.getElementById('load-user-btn').addEventListener('click', loadUserLeagues);
        document.getElementById('username-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadUserLeagues();
        });
        document.getElementById('league-selector').addEventListener('change', (e) => {
            switchLeague(e.target.value);
        });

        // Init
        loadUserLeagues();

    </script>
</body>
</html>
