<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleeper League Dashboard</title>

    <!-- ======================================================= -->
    <!--  USER CONFIGURATION: EDIT YOUR USERNAME                 -->
    <!-- ======================================================= -->
    <script>
        const SLEEPER_USERNAME = "standaggs";
    </script>
    <!-- ======================================================= -->

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0; background: #030712; z-index: 60; 
            transition: opacity 0.3s ease-in-out;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#050914] text-gray-200 font-sans h-screen overflow-hidden flex justify-center">
    <div class="w-full max-w-[1600px] h-full flex flex-col relative bg-gray-950 border-x border-gray-800 shadow-2xl">

    <!-- Loading Screen -->
    <div id="loading-screen" class="flex flex-col items-center justify-center" style="display: flex; opacity: 1;">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-bold text-white mb-2" id="loading-title">Connecting to Sleeper API</h2>
        <p class="text-gray-400 text-sm" id="loading-text">Fetching league matchups...</p>
    </div>

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 md:p-4 shrink-0 flex flex-col md:flex-row justify-between items-center gap-3 z-10 shadow-md">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="bg-blue-600 p-1.5 md:p-2 rounded-lg text-white">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-bold text-white tracking-wide leading-tight">League Dashboard</h1>
                <p class="text-[10px] md:text-xs text-blue-400 font-medium" id="week-indicator">Week --</p>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto">
            <input type="text" id="username-input" class="bg-gray-950 text-sm text-white px-3 py-1.5 md:py-2 rounded-md border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors w-full md:w-40" placeholder="Sleeper Username">
            <button id="load-user-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-3 md:px-4 py-1.5 md:py-2 rounded-md transition-colors shadow-sm">Load</button>
            <select id="league-selector" class="bg-gray-950 text-sm text-white px-3 py-1.5 md:py-2 rounded-md border border-gray-700 hidden focus:outline-none focus:border-blue-500 cursor-pointer max-w-[160px] md:max-w-[200px] truncate">
                <!-- Populated dynamically -->
            </select>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0 bg-[#0a0f1c]">
        
        <!-- Left Column: My Matchup Deep Dive -->
        <section class="flex-1 lg:flex-[3] flex flex-col border-b lg:border-b-0 lg:border-r border-gray-800 relative min-h-0">
            <div class="p-3 md:p-4 border-b border-gray-800 bg-gray-900/40 shrink-0 flex justify-between items-center backdrop-blur-sm shadow-sm z-10">
                <h2 class="text-sm md:text-lg font-bold text-white flex items-center gap-2 truncate">
                    <span class="w-2 h-2 rounded-full bg-green-500 shrink-0"></span> Head-to-Head
                </h2>
                <div id="matchup-margin" class="px-2 md:px-3 py-0.5 md:py-1 bg-gray-950 rounded-full text-[10px] md:text-xs font-bold border border-gray-800 text-gray-400 tracking-wider whitespace-nowrap">
                    Vs
                </div>
            </div>
            
            <div id="my-matchup-container" class="flex-1 overflow-hidden p-1.5 md:p-2.5 grid grid-cols-1 xl:grid-cols-2 gap-2 md:gap-3 h-full">
                <!-- Injected via JS -->
                <div class="flex w-full h-full items-center justify-center text-gray-500 italic text-sm col-span-full">
                    Select a league to view your matchup.
                </div>
            </div>
        </section>

        <!-- Right Column: League Scoreboard & NFL Games -->
        <section class="flex-1 lg:flex-[2] flex flex-col relative min-h-0 bg-gray-950">
            <div class="p-3 md:p-4 border-b border-gray-800 bg-gray-900/40 shrink-0 flex justify-between items-center backdrop-blur-sm shadow-sm z-10">
                <h2 class="text-sm md:text-lg font-bold text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> League Scoreboard
                </h2>
                <span class="text-[9px] md:text-xs text-gray-500 bg-gray-800 px-2 py-1 rounded-md" id="league-update-time">Waiting...</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-1.5 md:p-2.5 flex flex-col gap-3" id="league-scoreboard-container">
                <!-- Fantasy Matchups Grid -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-1.5 md:gap-2" id="league-matchups-grid">
                    <!-- Scoreboard Cards Injected Here -->
                </div>

                <!-- Live Top Scorers -->
                <div>
                    <div class="flex items-center gap-2 mb-1.5 border-b border-gray-800 pb-1.5 mt-2">
                        <span class="w-2 h-2 rounded-full bg-yellow-500"></span>
                        <h3 class="text-sm font-bold text-gray-300 uppercase tracking-widest">Live Top Scorers</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-1.5 md:gap-2" id="top-scorers-container">
                        <div class="col-span-full text-center text-xs text-gray-600 italic">Waiting for scoring data...</div>
                    </div>
                </div>
                
                <!-- Real NFL Games -->
                <div>
                    <div class="flex items-center gap-2 mb-1.5 border-b border-gray-800 pb-1.5">
                        <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                        <h3 class="text-sm font-bold text-gray-300 uppercase tracking-widest">NFL Games</h3>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2 md:gap-3" id="nfl-games-grid">
                        <div class="col-span-full text-center text-xs text-gray-600 italic">Waiting for NFL data...</div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Initialize username from config
        document.getElementById('username-input').value = typeof SLEEPER_USERNAME !== 'undefined' ? SLEEPER_USERNAME : "";

        // --- STATE VARIABLES ---
        let SLEEPER_USER_ID = null;
        let CURRENT_NFL_WEEK = null;
        let CURRENT_NFL_SEASON = null;
        let CURRENT_LEAGUE_ID = null;
        
        let LEAGUE_POSITIONS = [];
        let WEEKLY_PROJECTIONS = {};
        let SLEEPER_PLAYERS_DB = null;
        
        let CURRENT_MATCHUPS = [];
        let CURRENT_ROSTERS = [];
        let CURRENT_USERS = [];
        
        // Polling logic for both ESPN and Sleeper
        let TARGET_TEAMS = new Set();
        let currentGameStates = {};
        let matchupInterval = null;
        let espnInterval = null;

        // --- UI UTILITIES ---
        function showLoading(msg) {
            const screen = document.getElementById('loading-screen');
            document.getElementById('loading-text').innerText = msg;
            screen.style.display = 'flex';
            setTimeout(() => screen.style.opacity = '1', 10);
        }

        function hideLoading() {
            const screen = document.getElementById('loading-screen');
            screen.style.opacity = '0';
            setTimeout(() => screen.style.display = 'none', 300);
        }

        // --- CORE LOGIC ---
        async function loadUserLeagues() {
            const usernameInput = document.getElementById('username-input').value.trim();
            if (!usernameInput) return;

            showLoading(`Looking up user: ${usernameInput}...`);
            const selector = document.getElementById('league-selector');
            selector.classList.add('hidden');
            
            try {
                if (!CURRENT_NFL_WEEK || !CURRENT_NFL_SEASON) {
                    const stateRes = await fetch("https://api.sleeper.app/v1/state/nfl");
                    const state = await stateRes.json();
                    CURRENT_NFL_WEEK = state.leg || state.week;
                    CURRENT_NFL_SEASON = state.season;
                    document.getElementById('week-indicator').innerText = `NFL Week ${CURRENT_NFL_WEEK}`;
                }

                const userRes = await fetch(`https://api.sleeper.app/v1/user/${usernameInput}`);
                const user = await userRes.json();
                if (!user || !user.user_id) throw new Error("User not found.");
                SLEEPER_USER_ID = user.user_id;

                showLoading("Finding your active leagues...");
                const leaguesRes = await fetch(`https://api.sleeper.app/v1/user/${SLEEPER_USER_ID}/leagues/nfl/${CURRENT_NFL_SEASON}`);
                const leagues = await leaguesRes.json();

                if (!leagues || leagues.length === 0) {
                    throw new Error("No active leagues found for this season.");
                }

                selector.innerHTML = leagues.map(l => `<option value="${l.league_id}">${l.name}</option>`).join('');
                selector.classList.remove('hidden');

                await switchLeague(leagues[0].league_id);

            } catch(e) {
                console.error(e);
                document.getElementById('loading-text').innerHTML = `<span class="text-red-400">${e.message || "Error loading user data."}</span>`;
                setTimeout(hideLoading, 3000);
            }
        }

        async function switchLeague(leagueId) {
            showLoading("Extracting league data...");
            CURRENT_LEAGUE_ID = leagueId;
            
            if (matchupInterval) clearInterval(matchupInterval);
            if (espnInterval) clearInterval(espnInterval);

            try {
                // Fetch projections if needed
                if (!WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]) {
                    showLoading("Fetching weekly scoring projections...");
                    const projRes = await fetch(`https://api.sleeper.app/v1/projections/nfl/regular/${CURRENT_NFL_SEASON}/${CURRENT_NFL_WEEK}`);
                    WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK] = await projRes.json();
                }

                // Fetch player DB if needed
                if (!SLEEPER_PLAYERS_DB) {
                    showLoading("Downloading NFL Player Database... (One time only)");
                    const playersRes = await fetch("https://api.sleeper.app/v1/players/nfl");
                    SLEEPER_PLAYERS_DB = await playersRes.json();
                }

                // Fetch Static League Data
                const leagueRes = await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}`);
                const leagueData = await leagueRes.json();
                LEAGUE_POSITIONS = leagueData.roster_positions || [];

                CURRENT_ROSTERS = await (await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}/rosters`)).json();
                CURRENT_USERS = await (await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}/users`)).json();

                // Initial Data Pulls
                await fetchSleeperMatchups();
                await fetchEspnData();
                
                // Set up polling intervals (Sleeper every 30s, ESPN every 10s)
                matchupInterval = setInterval(fetchSleeperMatchups, 30000);
                espnInterval = setInterval(fetchEspnData, 10000);

                hideLoading();
            } catch(e) {
                console.error("League Load Error:", e);
                document.getElementById('loading-text').innerHTML = `<span class="text-red-400">Error: Could not load league.</span>`;
                setTimeout(hideLoading, 3000);
            }
        }

        async function fetchSleeperMatchups() {
            if (!CURRENT_LEAGUE_ID) return;
            try {
                const res = await fetch(`https://api.sleeper.app/v1/league/${CURRENT_LEAGUE_ID}/matchups/${CURRENT_NFL_WEEK}`);
                CURRENT_MATCHUPS = await res.json();
                
                renderLeagueScoreboard();
                renderMatchupCols();
                
                document.getElementById('league-update-time').innerText = `Updated: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                console.warn("Sleeper fetch error:", e);
            }
        }

        async function fetchEspnData() {
            try {
                const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
                if (!response.ok) return;
                const data = await response.json();
                
                currentGameStates = {};
                let nflHtml = '';
                
                (data.events || []).forEach(event => {
                    const comps = event.competitions || [];
                    if (!comps.length) return;
                    
                    const tState = event.status?.type?.state;
                    let tClock = event.status?.displayClock || (tState === "post" ? "Final" : "0:00");
                    const tPeriod = event.status?.period || 1;
                    
                    if (tState === 'pre') {
                        tClock = 'Pregame';
                    } else if (tState === 'in') {
                        tClock = `Q${tPeriod} ${tClock}`;
                    } else {
                        tClock = 'Final';
                    }
                    
                    const isRz = comps[0].situation?.isRedZone || false;
                    
                    const home = comps[0].competitors.find(c => c.homeAway === 'home');
                    const away = comps[0].competitors.find(c => c.homeAway === 'away');
                    
                    const hAbbr = home?.team?.abbreviation || '';
                    const aAbbr = away?.team?.abbreviation || '';
                    const hScore = home?.score || '0';
                    const aScore = away?.score || '0';
                    const hLogo = home?.team?.logo || 'https://sleepercdn.com/images/v2/icons/player_default.webp';
                    const aLogo = away?.team?.logo || 'https://sleepercdn.com/images/v2/icons/player_default.webp';

                    // Update global state for roster matching
                    [home, away].forEach(c => {
                        if (c?.team?.abbreviation) {
                            currentGameStates[c.team.abbreviation] = { state: tState, clock: tClock, isRedZone: isRz };
                        }
                    });
                    
                    // Build NFL Game Card
                    let bgClass = "bg-gray-900/60 border-gray-800 hover:bg-gray-800/80";
                    let clockClass = "text-gray-500";
                    let hScoreClass = "text-gray-400";
                    let aScoreClass = "text-gray-400";
                    let hNameClass = "text-gray-400";
                    let aNameClass = "text-gray-400";
                    
                    if (tState === 'in') {
                        bgClass = isRz ? "bg-red-950/30 border-red-900/50" : "bg-green-950/20 border-green-900/40";
                        clockClass = isRz ? "text-red-400 animate-pulse font-bold" : "text-green-400 font-bold";
                        if (parseInt(hScore) >= parseInt(aScore)) { hScoreClass = "text-white"; hNameClass = "text-gray-200"; }
                        if (parseInt(aScore) >= parseInt(hScore)) { aScoreClass = "text-white"; aNameClass = "text-gray-200"; }
                    } else if (tState === 'post') {
                        bgClass = "bg-gray-950/80 border-gray-800/50 opacity-70";
                        if (parseInt(hScore) > parseInt(aScore)) { hScoreClass = "text-white"; hNameClass = "text-gray-200"; }
                        if (parseInt(aScore) > parseInt(hScore)) { aScoreClass = "text-white"; aNameClass = "text-gray-200"; }
                    } else if (tState === 'pre') {
                        bgClass = "bg-blue-950/10 border-blue-900/20";
                    }

                    nflHtml += `
                        <div class="flex flex-col p-2 rounded-lg border ${bgClass} transition-colors gap-1.5 shadow-sm">
                            <!-- Away -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-1.5 overflow-hidden">
                                    <img src="${aLogo}" class="w-4 h-4 object-contain shrink-0">
                                    <span class="text-xs font-semibold ${aNameClass} truncate">${aAbbr}</span>
                                </div>
                                <span class="text-xs font-mono font-bold ${aScoreClass}">${tState === 'pre' ? '-' : aScore}</span>
                            </div>
                            <!-- Home -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-1.5 overflow-hidden">
                                    <img src="${hLogo}" class="w-4 h-4 object-contain shrink-0">
                                    <span class="text-xs font-semibold ${hNameClass} truncate">${hAbbr}</span>
                                </div>
                                <span class="text-xs font-mono font-bold ${hScoreClass}">${tState === 'pre' ? '-' : hScore}</span>
                            </div>
                            <!-- Status -->
                            <div class="text-[9px] font-mono tracking-tighter text-right mt-0.5 ${clockClass}">
                                ${tClock}
                            </div>
                        </div>
                    `;
                });
                
                const nflGrid = document.getElementById('nfl-games-grid');
                if (nflGrid) nflGrid.innerHTML = nflHtml;
                
                // Re-render only the matchup columns to immediately show updated clocks / RZ states
                if (TARGET_TEAMS.size > 0) renderMatchupCols();
                
            } catch (e) {
                console.warn("ESPN fetch error:", e);
            }
        }

// --- RENDERING PIPELINE ---

        function renderLeagueScoreboard() {
            if (!CURRENT_MATCHUPS.length || !CURRENT_ROSTERS.length) return;

            const teamInfo = {};
            CURRENT_ROSTERS.forEach(r => {
                const user = CURRENT_USERS.find(u => u.user_id === r.owner_id);
                let name = "Empty Roster";
                let avatar = "https://sleepercdn.com/images/v2/icons/player_default.webp";
                if (user) {
                    name = user.metadata?.team_name || user.display_name;
                    if (user.avatar) avatar = `https://sleepercdn.com/avatars/thumbs/${user.avatar}`;
                }
                
                let w = r.settings?.wins || 0;
                let l = r.settings?.losses || 0;
                let pf = (r.settings?.fpts || 0) + ((r.settings?.fpts_decimal || 0) / 100);
                
                teamInfo[r.roster_id] = { name, avatar, owner_id: r.owner_id, w, l, pf, roster: r };
            });

            const groupedMatchups = {};
            let myMatchupId = null;

            CURRENT_MATCHUPS.forEach(m => {
                if (!groupedMatchups[m.matchup_id]) groupedMatchups[m.matchup_id] = [];
                groupedMatchups[m.matchup_id].push(m);

                if (teamInfo[m.roster_id]?.owner_id === SLEEPER_USER_ID) {
                    myMatchupId = m.matchup_id;
                }
            });

            const calculateMatchupStats = (matchup) => {
                let actual = 0, proj = 0, ytp = 0;
                if (!matchup || !matchup.starters) return { actual, proj, ytp };
                matchup.starters.forEach(pid => {
                    if (pid === "0") return;
                    actual += (matchup.players_points?.[pid] || 0);
                    const pObj = WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]?.[pid];
                    if (pObj) proj += pObj.pts_ppr ?? pObj.pts_half_ppr ?? pObj.pts_std ?? 0;
                    
                    const pData = SLEEPER_PLAYERS_DB?.[pid];
                    let pTeam = (pid.length <= 4 && isNaN(parseInt(pid))) ? pid : (pData?.team || "FA");
                    const state = currentGameStates[pTeam]?.state;
                    if (state !== 'post') ytp++;
                });
                return { actual, proj, ytp };
            };

            const scoreboardGrid = document.getElementById('league-matchups-grid');
            let scoreboardHTML = '';

            Object.keys(groupedMatchups).forEach(mId => {
                const teams = groupedMatchups[mId];
                if (teams.length !== 2) return;

                const team1 = teams[0];
                const team2 = teams[1];
                
                const info1 = teamInfo[team1.roster_id];
                const info2 = teamInfo[team2.roster_id];
                const stats1 = calculateMatchupStats(team1);
                const stats2 = calculateMatchupStats(team2);
                
                const isMyMatchup = (mId == myMatchupId);
                const borderClass = isMyMatchup ? 'border-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.15)]' : 'border-gray-800 hover:border-gray-700';
                const bgClass = isMyMatchup ? 'bg-gray-900/90' : 'bg-gray-900/40';

                scoreboardHTML += `
                    <div class="rounded-lg border ${borderClass} ${bgClass} p-2 flex flex-col gap-1.5 transition-colors shadow-sm">
                        ${isMyMatchup ? '<div class="text-[8px] uppercase font-bold tracking-widest text-blue-400 mb-0.5">Your Matchup</div>' : ''}
                        
                        <!-- Team 1 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <img src="${info1.avatar}" class="w-6 h-6 rounded-full bg-gray-800 shrink-0 border border-gray-700 object-cover" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                <div class="flex flex-col overflow-hidden">
                                    <span class="font-semibold text-xs truncate ${stats1.actual > stats2.actual ? 'text-white' : 'text-gray-400'}">${info1.name}</span>
                                    <span class="text-[8px] text-gray-500 font-mono tracking-tighter truncate">${info1.w}-${info1.l} • ${stats1.ytp} To Play</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0 ml-2 flex items-center gap-2">
                                <div class="text-[9px] text-gray-600 font-mono hidden 2xl:block tracking-tighter">Proj ${stats1.proj.toFixed(1)}</div>
                                <div class="text-sm font-bold font-mono leading-none ${stats1.actual > stats2.actual ? 'text-white' : 'text-gray-500'}">${stats1.actual.toFixed(2)}</div>
                            </div>
                        </div>
                        
                        <div class="w-full h-px bg-gray-800/60 my-0.5"></div>
                        
                        <!-- Team 2 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <img src="${info2.avatar}" class="w-6 h-6 rounded-full bg-gray-800 shrink-0 border border-gray-700 object-cover" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                <div class="flex flex-col overflow-hidden">
                                    <span class="font-semibold text-xs truncate ${stats2.actual > stats1.actual ? 'text-white' : 'text-gray-400'}">${info2.name}</span>
                                    <span class="text-[8px] text-gray-500 font-mono tracking-tighter truncate">${info2.w}-${info2.l} • ${stats2.ytp} To Play</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0 ml-2 flex items-center gap-2">
                                <div class="text-[9px] text-gray-600 font-mono hidden 2xl:block tracking-tighter">Proj ${stats2.proj.toFixed(1)}</div>
                                <div class="text-sm font-bold font-mono leading-none ${stats2.actual > stats1.actual ? 'text-white' : 'text-gray-500'}">${stats2.actual.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            scoreboardGrid.innerHTML = scoreboardHTML;
            
            // Render Live Top Scorers
            renderTopScorers(teamInfo);
        }
        
        function renderTopScorers(teamInfo) {
            let allScorers = [];
            CURRENT_MATCHUPS.forEach(m => {
                if (!m.starters) return;
                m.starters.forEach((pid, idx) => {
                    if (pid === "0") return;
                    const pts = m.players_points?.[pid] || 0;
                    if (pts > 0) {
                        allScorers.push({ pid, pts, roster_id: m.roster_id, posLabel: LEAGUE_POSITIONS[idx] || 'FLX' });
                    }
                });
            });
            
            allScorers.sort((a,b) => b.pts - a.pts);
            let top6 = allScorers.slice(0, 6); // Top 6 fits well in 3 cols
            
            let html = '';
            top6.forEach(scorer => {
                const pData = SLEEPER_PLAYERS_DB[scorer.pid];
                let pName = scorer.pid;
                let pImg = `https://sleepercdn.com/content/nfl/players/thumb/${scorer.pid}.jpg`;
                if (scorer.pid.length <= 4 && isNaN(parseInt(scorer.pid))) {
                    pName = `${scorer.pid} DEF`;
                    pImg = `https://sleepercdn.com/images/team_logos/nfl/${scorer.pid.toLowerCase()}.png`;
                } else if (pData) {
                    pName = pData.last_name ? `${pData.first_name.charAt(0)}. ${pData.last_name}` : pData.first_name;
                }
                
                const tInfo = teamInfo[scorer.roster_id];
                const teamName = tInfo ? tInfo.name : 'Unknown Team';
                
                html += `
                    <div class="flex items-center justify-between p-1.5 rounded-md border bg-gray-900/40 border-gray-800 shadow-sm gap-2">
                        <div class="flex items-center gap-1.5 overflow-hidden">
                            <img src="${pImg}" class="w-5 h-5 rounded-full bg-gray-800 border border-gray-700 object-cover shrink-0" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                            <div class="flex flex-col min-w-0">
                                <span class="text-[10px] font-semibold text-white truncate leading-tight">${pName}</span>
                                <span class="text-[8px] text-gray-500 truncate">${teamName}</span>
                            </div>
                        </div>
                        <div class="text-right shrink-0 font-mono text-xs font-bold text-yellow-400">
                            ${scorer.pts.toFixed(1)}
                        </div>
                    </div>
                `;
            });
            
            if (!html) html = `<div class="col-span-full text-center text-xs text-gray-600 italic">No points scored yet...</div>`;
            document.getElementById('top-scorers-container').innerHTML = html;
        }

        function renderMatchupCols() {
            if (!CURRENT_MATCHUPS.length || !CURRENT_ROSTERS.length) return;
            
            const myRoster = CURRENT_ROSTERS.find(r => r.owner_id === SLEEPER_USER_ID);
            if (!myRoster) return;
            
            const myMatchup = CURRENT_MATCHUPS.find(m => m.roster_id === myRoster.roster_id);
            if (!myMatchup) return;
            
            const oppMatchup = CURRENT_MATCHUPS.find(m => m.matchup_id === myMatchup.matchup_id && m.roster_id !== myRoster.roster_id);
            const oppRoster = CURRENT_ROSTERS.find(r => r.roster_id === (oppMatchup?.roster_id)) || {};
            
            TARGET_TEAMS.clear();

            const buildCol = (matchup, roster, isMe) => {
                if (!matchup) {
                    return { 
                        html: `<div class="flex flex-col min-w-0 bg-gray-900 border border-gray-800 rounded-lg h-full"><div class="p-4 text-center text-gray-500 italic text-xs">No Opponent</div></div>`, 
                        actual: 0 
                    };
                }
                
                let name = "Empty";
                let avatar = "https://sleepercdn.com/images/v2/icons/player_default.webp";
                const user = CURRENT_USERS.find(u => u.user_id === roster.owner_id);
                if (user) {
                    name = user.metadata?.team_name || user.display_name;
                    if (user.avatar) avatar = `https://sleepercdn.com/avatars/thumbs/${user.avatar}`;
                }
                
                let w = roster.settings?.wins || 0;
                let l = roster.settings?.losses || 0;
                
                let actual = 0, proj = 0, ytp = 0;
                matchup.starters.forEach(pid => {
                    if (pid !== "0") {
                        actual += (matchup.players_points?.[pid] || 0);
                        const pObj = WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]?.[pid];
                        if (pObj) proj += pObj.pts_ppr ?? pObj.pts_half_ppr ?? pObj.stats?.pts_ppr ?? 0;
                        
                        const pData = SLEEPER_PLAYERS_DB?.[pid];
                        let pTeam = (pid.length <= 4 && isNaN(parseInt(pid))) ? pid : (pData?.team || "FA");
                        const state = currentGameStates[pTeam]?.state;
                        if (state !== 'post') ytp++;
                    }
                });
                
                const activePos = LEAGUE_POSITIONS.filter(p => p !== 'BN');
                
                const renderPlayerRow = (pid, posLabel, isBench = false) => {
                    if (pid === "0") {
                        return `
                        <div class="flex items-center gap-1.5 py-0.5 px-1.5 md:py-1 md:px-2 rounded bg-gray-950/40 border border-gray-800/40">
                            <div class="text-[9px] md:text-[10px] font-bold text-gray-600 w-8 md:w-10 shrink-0 text-right pr-1 md:pr-1.5 border-r border-gray-800 uppercase tracking-wider">${posLabel === 'SUPER_FLEX' ? 'S-FLX' : posLabel}</div>
                            <div class="text-[10px] text-gray-600 italic ml-1">Empty Slot</div>
                        </div>`;
                    }
                    
                    const pData = SLEEPER_PLAYERS_DB[pid];
                    let pName = pid;
                    let pTeam = "";
                    let pImg = `https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`;
                    
                    if (pid.length <= 4 && isNaN(parseInt(pid))) {
                        pName = `${pid} DEF`; pTeam = pid;
                        pImg = `https://sleepercdn.com/images/team_logos/nfl/${pid.toLowerCase()}.png`;
                    } else if (pData) {
                        pName = pData.last_name ? `${pData.first_name.charAt(0)}. ${pData.last_name}` : pData.first_name;
                        pTeam = pData.team || "FA";
                    }
                    
                    if (pTeam && pTeam !== "FA") TARGET_TEAMS.add(pTeam);
                    
                    const tData = currentGameStates[pTeam];
                    const state = tData?.state;
                    const clock = tData?.clock || "Pregame";
                    const isRz = tData?.isRedZone;
                    
                    let bgClass = "bg-gray-800/30 border-gray-700/40 hover:bg-gray-800/60";
                    let clockHtml = `<span class="text-gray-500">${pTeam} • ${clock}</span>`;
                    
                    if (state === "in") {
                        bgClass = isRz ? "bg-red-950/40 border-red-800/50" : "bg-green-950/20 border-green-800/30";
                        clockHtml = `<span class="${isRz ? 'text-red-400 font-bold animate-pulse' : 'text-green-400'}">${pTeam} • ${clock}</span>`;
                    } else if (state === "post") {
                        bgClass = "bg-gray-900/70 border-gray-800/50 opacity-75";
                    }
                    
                    const pPts = (matchup.players_points?.[pid] || 0).toFixed(1);
                    const pProj = (WEEKLY_PROJECTIONS[CURRENT_NFL_WEEK]?.[pid]?.pts_ppr || 0).toFixed(1);
                    
                    return `
                        <div class="flex items-center justify-between gap-1 py-0.5 px-1.5 md:py-1 md:px-2 rounded border ${bgClass} transition-colors">
                            <div class="flex items-center gap-1.5 overflow-hidden flex-1 min-w-0">
                                <div class="text-[9px] md:text-[10px] font-bold ${isMe ? 'text-blue-500/80' : 'text-gray-500'} w-8 md:w-10 shrink-0 text-right pr-1 md:pr-1.5 border-r border-gray-700/50 uppercase tracking-wider">${posLabel === 'SUPER_FLEX' ? 'S-FLX' : posLabel}</div>
                                <img src="${pImg}" class="w-6 h-6 md:w-7 md:h-7 rounded-full bg-gray-900 border border-gray-700 object-cover shrink-0" onerror="this.src='https://sleepercdn.com/images/v2/icons/player_default.webp'">
                                <div class="flex flex-col justify-center min-w-0 overflow-hidden ml-0.5">
                                    <div class="text-[10px] md:text-[11px] font-semibold text-gray-200 truncate leading-tight">${pName}</div>
                                    <div class="text-[8px] font-mono tracking-tighter truncate">${clockHtml}</div>
                                </div>
                            </div>
                            <div class="text-right shrink-0 pl-1 flex flex-col justify-center">
                                <div class="text-[11px] md:text-xs font-bold font-mono text-gray-100 leading-none">${pPts}</div>
                                ${isBench ? `<div class="text-[7px] text-gray-500 font-mono mt-0.5">Proj ${pProj}</div>` : ''}
                            </div>
                        </div>
                    `;
                };

                let startersRows = '';
                matchup.starters.forEach((pid, idx) => {
                    startersRows += renderPlayerRow(pid, activePos[idx] || 'FLX', false);
                });
                
                let benchRows = '';
                const benchIds = matchup.players.filter(id => !matchup.starters.includes(id));
                benchIds.forEach(pid => {
                    const posLabel = (roster.reserve && roster.reserve.includes(pid)) ? 'IR' : 'BN';
                    benchRows += renderPlayerRow(pid, posLabel, true);
                });

                let html = `
                    <div class="flex flex-col min-w-0 h-full border ${isMe ? 'border-blue-900/50' : 'border-gray-800'} rounded-lg overflow-hidden bg-gray-900/40 shadow-sm">
                        <div class="flex items-center justify-between p-2 md:p-3 bg-gray-900 border-b ${isMe ? 'border-blue-900/50' : 'border-gray-800'} shrink-0 z-10 shadow-sm">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <img src="${avatar}" class="w-8 h-8 rounded-full border border-gray-700 object-cover shrink-0">
                                <div class="min-w-0 flex flex-col justify-center">
                                    <h3 class="font-bold text-gray-200 text-sm md:text-base truncate leading-tight">${name}</h3>
                                    <p class="text-[9px] md:text-[10px] text-gray-500 tracking-widest uppercase">${w}-${l} • <span class="${ytp > 0 ? 'text-green-400 font-bold' : ''}">${ytp} To Play</span></p>
                                </div>
                            </div>
                            <div class="text-right shrink-0 pl-2">
                                <div class="text-lg md:text-xl font-bold font-mono ${isMe ? 'text-blue-400' : 'text-red-400'} leading-none">${actual.toFixed(2)}</div>
                                <div class="text-[9px] md:text-[10px] text-gray-500 font-mono tracking-tight mt-0.5">Proj ${proj.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="flex-1 overflow-hidden grid grid-cols-1 lg:grid-cols-2 gap-0 divide-y lg:divide-y-0 lg:divide-x ${isMe ? 'divide-blue-900/30' : 'divide-gray-800'}">
                            <div class="flex flex-col h-full min-w-0">
                                <div class="p-1.5 bg-gray-900/60 text-center border-b ${isMe ? 'border-blue-900/30' : 'border-gray-800'} shrink-0">
                                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Starters</span>
                                </div>
                                <div class="flex-1 overflow-y-auto p-1 md:p-1.5 space-y-0 no-scrollbar">
                                    ${startersRows}
                                </div>
                            </div>
                            <div class="flex flex-col h-full min-w-0 opacity-95 hover:opacity-100 transition-opacity">
                                <div class="p-1.5 bg-gray-900/60 text-center border-b ${isMe ? 'border-blue-900/30' : 'border-gray-800'} shrink-0">
                                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Bench & IR</span>
                                </div>
                                <div class="flex-1 overflow-y-auto p-1 md:p-1.5 space-y-0 no-scrollbar">
                                    ${benchRows}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                return { html, actual };
            };
            
            const myData = buildCol(myMatchup, myRoster, true);
            const oppData = buildCol(oppMatchup, oppRoster, false);
            
            // Build the wrapping container dynamically to ensure pure two columns
            document.getElementById('my-matchup-container').innerHTML = `
                ${myData.html}
                ${oppData.html}
            `;
            
            // Update Margin indicator in header
            const marginEl = document.getElementById('matchup-margin');
            const diff = myData.actual - (oppData.actual || 0);
            
            if (myData.actual === 0 && (!oppData.actual || oppData.actual === 0)) {
                marginEl.innerHTML = `0.00 - 0.00`;
            } else if (diff > 0) {
                marginEl.innerHTML = `<span class="text-green-400 drop-shadow-sm">Up ${diff.toFixed(2)}</span>`;
            } else if (diff < 0) {
                marginEl.innerHTML = `<span class="text-red-400 drop-shadow-sm">Down ${Math.abs(diff).toFixed(2)}</span>`;
            } else {
                marginEl.innerHTML = `<span class="text-gray-400">Tied</span>`;
            }
        }

        // Event Listeners
        document.getElementById('load-user-btn').addEventListener('click', loadUserLeagues);
        document.getElementById('username-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadUserLeagues();
        });
        document.getElementById('league-selector').addEventListener('change', (e) => {
            switchLeague(e.target.value);
        });

        // Init
        loadUserLeagues();

    </script>
    </div>
</body>
</html>
